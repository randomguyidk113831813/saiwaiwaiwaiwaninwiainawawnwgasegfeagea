name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create App Bundle
        run: |
          # This creates the real folder structure Sideloadly needs
          mkdir -p Payload/ShareScreen.app
          echo "Build Version 1.0" > Payload/ShareScreen.app/version.txt
          
          # Create a dummy Info.plist so iOS thinks it's a real app
          cat <<EOF > Payload/ShareScreen.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ShareScreen</string>
              <key>CFBundleIdentifier</key>
              <string>com.saiwan.sharescreen</string>
              <key>CFBundleName</key>
              <string>ShareScreen</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF
          
          # Zip it into an .ipa file
          zip -r share-screen-saiwan.ipa Payload
          mkdir -p output
          mv share-screen-saiwan.ipa output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: share-screen-ipa
          path: output/share-screen-saiwan.ipa
