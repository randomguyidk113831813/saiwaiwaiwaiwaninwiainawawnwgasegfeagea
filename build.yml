name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build IPA
        run: |
          mkdir -p output
          echo "Building Share Screen for Saiwan..." > output/share-screen-for-saiwan.ipa
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: share-screen-ipa
          path: output/share-screen-for-saiwan.ipa
