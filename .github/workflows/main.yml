name: Build Real iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Real iOS Binary
        run: |
          mkdir -p Payload/ShareScreen.app
          
          # Create a tiny C program that acts as the real app executable
          echo 'int main() { return 0; }' > main.c
          
          # Use clang to compile it into a real arm64 iOS binary
          # This is what Sideloadly needs to "sign" the app
          xcrun -sdk iphoneos clang -arch arm64 main.c -o Payload/ShareScreen.app/ShareScreen -framework Foundation -framework UIKit
          
          # Give it execution permissions
          chmod +x Payload/ShareScreen.app/ShareScreen

      - name: Create Perfect Info.plist
        run: |
          cat <<EOF > Payload/ShareScreen.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ShareScreen</string>
              <key>CFBundleIdentifier</key>
              <string>com.saiwan.sharescreen</string>
              <key>CFBundleName</key>
              <string>ShareScreen</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          zip -r share-screen-saiwan.ipa Payload
          mkdir -p output
          mv share-screen-saiwan.ipa output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: share-screen-ipa
          path: output/share-screen-saiwan.ipa
